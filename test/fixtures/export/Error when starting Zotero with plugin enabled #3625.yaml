    title: 'A comprehensive review of electrochemical exfoliation of graphite for tunable graphene architecture: Mechanistic insights, design principles, functional derivatives, and emerging applications'
    abstractNote: Graphene has attracted considerable attention owing to its exceptional physical and chemical properties, which support a wide range of scientific and technological applications. Although numerous synthesis methods have been developed for scalable production, many conventional techniques involve high temperatures, hazardous reagents, or complex processing steps. As a more sustainable and efficient alternative, electrochemical exfoliation has emerged as a promising approach for graphene synthesis. This review provides a comprehensive overview of electrochemical exfoliation, including its fundamental principles, underlying mechanisms, and the tunability of graphene properties through controllable process parameters. Furthermore, its utility in the synthesis of graphene derivatives and composite materials is discussed, thereby broadening its applicability across various research domains. Recent advances in energy-related and sensing applications are examined, alongside current challenges and future perspectives for establishing electrochemical exfoliation as a practical and scalable method for producing high-quality graphene.
