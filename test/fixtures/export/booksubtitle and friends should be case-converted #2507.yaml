    postscript: |-
      if (Translator.BetterBibLaTeX) {
          const split = (title) => {
              const m = title.match(/^(.+)([?:;]) (.+?)$/)
              return m && { main: m[1] + m[2].replace(/:/, ""), sub: m[3] }
          }
      
          const add = (m, pre) => {
              const params = { }
              const { main, sub } = m
              reference.add({ name: pre("title"), value: main, ...params })
              reference.add({ name: pre("subtitle"), value: sub, ...params })
          }
      
          if (reference.has.booktitle) {
              const booktitle = split(reference.has.booktitle.value)
              if (booktitle)
                  add(booktitle, (name) => "book" + name)
          }
      
          if (reference.has.title) {
              const title = split(reference.has.title.value)
              if (title && !title.title.match(/\((?!.*\))/))
                  add(title, (name) => name)
          }
      }
    warnBulkModify: 0
    warnTitleCased: true
