  - key: B9V2V6FQ
    version: 2997
    itemType: conferencePaper
    title: 'AI Empowerment: Innovation and Exploration of Image-Based Virtual and Real Restoration Technology for Murals of Shoroon Bumbagar Tomb'
    abstractNote: This paper focuses on the study of image-based virtual and real restoration technology in the era of artificial intelligence, aiming to solve the problem of restoration of ancient murals damaged by natural and human factors in Mongolia's Shoroon Bumbagar Tomb. AI technologies-deep learning, generative adversarial networks for example-can analyze mural image, and accurately restore damaged areas. The findings demonstrate that this method outperforms traditional approaches in mural restoration, enhancing both accuracy and efficiency while offering a novel technical solution for cultural heritage preservation.
