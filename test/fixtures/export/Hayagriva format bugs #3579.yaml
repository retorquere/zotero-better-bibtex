  - key: 2GBWVPAK
    version: 1916
    itemType: bookSection
    title: "The Place of Money in Marx\u2019s Theory of Capital"
    abstractNote: In this chapter, Teixeira seeks to locate the Marxist theory of money in relation to the major objective of his intellectual pathway, which was to unravel the mode of being of capitalist sociability through a theory of capital. Money in Marx appears not as an autonomous and self-sufficient entity of a specific monetary theory but as a theoretical moment prior to the advent of capital, a concept that, notwithstanding, assumes the protagonism of the process of social reproduction, modifying the forms of the existence of money and reconfiguring the elements of the Marxist exposition method, potentially making it capable of explaining the monetary and financial phenomena of contemporary capitalism.
