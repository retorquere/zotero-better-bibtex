    abstractNote: Anlässlich seines 70. Jubiläums präsentiert das Leibniz-Institut für Europäische Geschichte (IEG) seit dem 12.09.2020 die Ausstellung »Vom Kalten Krieg zum europäischen Umbruch. Das Institut für Europäische Geschichte 1950–1990«. Die Ausstellung ist gleichzeitig als virtuelle Ausstellung zu sehen. Das IEG wurde fünf Jahre nach Kriegsende 1950 in Mainz gegründet. Ende 1952 konnte es in die für diesen Zweck wiederaufgebaute Domus Universitatis einziehen. Bei der Gründung des Instituts wirkten die »Besatzungsmächte« Frankreich und USA mit dem jungen Land Rheinland-Pfalz zusammen. Denn die französische Militärregierung förderte Einrichtungen, die der »Umerziehung« der Deutschen zur Demokratie und der Verständigung mit Frankreich dienen sollten. Auch die USA unterstützen Einrichtungen, die die junge Demokratie in Westdeutschland stärken sollten. Rheinland-Pfalz übernahm die Trägerschaft und schließlich auch die Finanzierung. Das neue Institut sollte die konfliktreiche historische Entwicklung Europas erforschen und so auf wissenschaftlichem Weg auf Frieden und Verständigung in Europa hinarbeiten. Die Ausstellung geht der Gründungsgeschichte des Instituts und seiner Entwicklung über vier Jahrzehnte nach. Von Anfang an war umstritten, worauf ein friedliches Europa gründen sollte, und welches Geschichtsbild das Institut in der Bundesrepublik befördern sollte. Die Präsentation thematisiert beispielsweise, wie das Institut seine »europäische Mission« legitimierte und mit der »Last« des Nationalsozialismus umging. Von Beginn an machte sich das Institut die Förderung junger Wissenschaftlerinnen und Wissenschaftler aus dem In- und Ausland zur Aufgabe. Das internationale Stipendienprogramm wurde zu einem Pfeiler des IEG. Angesichts der Wohnungsnot im Mainz der Nachkriegszeit war es selbstverständlich, dass das Institutsgebäude neben Bibliothek, Konferenzraum und Büros auch Wohnraum für wissenschaftliche Gäste und für die beiden Direktoren bot. Unter dem Dach der Domus Universitatis entfaltete sich das Arbeiten und Leben der Institutsangehörigen als Arbeits- und Konfliktgemeinschaft. Wie sich das Institut in der westdeutschen und in der internationalen Wissenschaftslandschaft etablierte, und wie es seit den 1960er-Jahren für Wissenschaftler/innen aus dem »Ostblock« ein »Fenster zum Westen« wurde, erzählt die Ausstellung anhand historischer Dokumente und Zeitzeugenberichte.
