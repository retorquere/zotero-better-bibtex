    url: https://edinburghuniversitypress.com/book-lucretius-ii.html
    place: Edinburgh
    publisher: Edinburgh University
    ISBN: 978-1-4744-6666-0
    date: 2020-03-01
    extra: "Pages: 240\ntex.owner: napoletano\ntex.priority: prio1\ntex.timestamp: 2020-09-12"
    accessDate: 2020-07-10
    language: English
    abstractNote: 'An ancient ethics for modern life - Develops an original ethics of motion for the 21st century from Lucretius'' didactic poem De Rerum Natura - Argues uniquely that Lucretius had a distinct ethical theory from Epicurus - Puts Lucretius in conversation with contemporary physics and new materialism Lucretius II launch offer - Find out where it all started: we''re offering a free ebook of Lucretius I when you buy a copy of Lucretius II. Just add a copy of Lucretius II (paperback, hardback or ebook) and a Lucretius I ebook to your basket, and enter the code Lucretius2 when you check out. Visit the webpage for Lucretius I Human suffering, the fear of death, war, poverty, ecological destruction and social inequality: almost 2,000 ago Lucretius proposed an ethics of motion as simple and stunning solution to these ethical problems. Thomas Nail argues that Lucretius was the first to locate the core of all these ethical ills in our obsession with stasis, our fear of movement and our hatred of matter. Instead of trying to transcend nature with our minds, escape it with our immortal souls and dominate it with our technologies, Lucretius was perhaps the first in the Western tradition to forcefully argue for a completely materialist, immanent and naturalistic ethics based on moving well with and as nature. If we want to survive and live well on this planet, Lucretius taught us, our best chance is not to struggle against nature but to embrace it and facilitate its movement. Lucretius II is the second installment in Thomas Nail''s transformative reading of Lucretius'' didactic poem De Rerum Natura, which can be read individually or as a trilogy. Lucretius I covered books 1 and 2 of De Rerum Natura and looked at Lucretius'' ontology; this volume covers books 3 and 4 and Lucretius'' ethics. The third and final volume will cover books 5 and 6.'
    title: 'Lucretius II: An ethics of motion'
