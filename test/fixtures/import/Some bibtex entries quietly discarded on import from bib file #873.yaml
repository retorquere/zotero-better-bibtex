    notes:
      -
        key: ICYZCN9T
        version: 0
        itemType: note
        parentItem: 5KI5EERN
        note: Describes a technique for adding automatic repair to model checking verification. They use abductive model revision to alter a concurrent program description in the face of a counterexample. Their concurrent programs are described in terms of jumps and (boolean) assignments. Repairs are in terms of changing assignment values and changing assignment orderings. The class of repairs considered here seem most appropriate for handling concurrency protocol errors, especially involving mutual exclusion and deadlocks. They seem less appropriate for control applications. Counterexamples are used to reduce the set of repair candidates that must be considered. (In order to handle ACTL formulas, the authors consider tree-shaped counterexamples, not just simple linear counterexamples.) In particular, their technique “identifies corrections α under which the counterexample is invariant, i.e., still apply if α is implemented.” They introduce efficiently computable conditions on counterexamples and corrections that provide this filtering.
        tags: []
        relations: {}
