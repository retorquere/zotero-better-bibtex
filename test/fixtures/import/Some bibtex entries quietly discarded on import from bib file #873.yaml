        key: XTME48WU
        version: 0
        itemType: note
        parentItem: TQSSBVX2
        note: Similar to Drummond and Bresina paper Drummond:90, indeed an attempt to put it on more secure theoretical footing. Project is trying to find a path through a state-space automaton. Deliberation scheduling in this framework is the allocation of resources between <i>policy generation</i> for a subgraph of the overall automaton and <i>envelope expansion</i> to consider a larger subset of the state space. Compares <i>precursor-deliberation</i>, where you develop the whole policy before any execution, and <i>recurrent-deliberation</i>, where the agent repeatedly replans.
