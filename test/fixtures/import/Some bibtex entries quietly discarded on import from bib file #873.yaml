    extra: "tex.citeseer-isreferncedby: oai:CiteSeerPSU:80136\ntex.oai: oai:CiteSeerPSU:507370\ntex.subject: Francois F'elix Ingr,Olivier Despouys Propice-Plan: Toward a Unified Framework for Planning and Execution"
    language: en
    abstractNote: 'In this paper, we investigate the links between planning and plans execution. We propose a new approach (Propice-Plan) which integrates both activities. It implements supervision and execution capabilities, combined with different planning techniques: – plan synthesis to complement existing operational plans; and – anticipation planning to advise the execution for the best option to take when facing choices (by anticipating plans execution), and to forecast problems that may arise due to unforeseen situations.'
