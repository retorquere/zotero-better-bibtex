    itemID: 1186
    attachments: []
    notes:
      -
        key: 3DNBXXQS
        version: 0
        itemType: note
        parentItem: NJ5XRBYQ
        note: Fits HTN planning into Rao's unifying framework. Also shows how to do this in partially hierarchical domains, i.e., those where some goals do not have methods and use normal precondition-chaining. This doesn't really arise in our playbook applications, but it's very neat. Hard to tell how well this works out, since there are a whole bunch of fairly complex bits necessary to ensure completeness and systematicity. The latter could, of course, be sacrificed. Seems to subsume the hierarchical planning in DPOCL and Barrent and Weld, which is handy! It's always nice to be able to not read a paper!
