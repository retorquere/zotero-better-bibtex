    abstractNote: This article examines the meanings and norms surrounding subjectivity across traditional and new forms of cultural journalism. While the ideal of objectivity is key to American journalism and its development as a profession, recent scholarship and new media developments have challenged the dominance of objectivity as a professional norm. This article begins with the understanding that subjectivity is an intractable part of knowing (and reporting on) the world around us to build our understanding of different modes of subjectivity and how these animate journalistic practices. Taking arts reporting, specifically reviewing, as a case study, the analysis draws on interviews with 40 book reviewers who write for major American newspapers, including The New York Times, The Los Angeles Times, The Washington Post, and prominent blogs. Findings reveal how emotions, bias, and self-interest are salient – sometimes as vice and sometimes as virtue – across the workflow of critics writing for...
