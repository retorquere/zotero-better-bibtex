    abstractNote: National television captured the gathering of thousands of people promoting Nazi, KKK and white supremacist ideology and also showed the citizens of Charlottesville standing up to these un-American ideas. The violence was hard to watch, and then on Saturday afternoon the cameras captured the domestic terror attack by Nazi sympathizer James Alex Fields, Jr., 20, who deliberately drove his car into peaceful protestors, resulting in the murder of Heather Heyer, 32, and the injury of 19 others. During the 2016 campaign season we witnessed how easily hate tears at the hearts and minds of our citizens and how a right-leaning, populist presidential candidate could stir the lowest parts of the soul into action, setting back our fight for equality.
