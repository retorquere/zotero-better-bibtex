    abstractNote: In this eye-opening, intellectually stimulating appreciation of a fascinating school of philosophy, Terry Eagleton makes a powerful argument that materialism is at the center of today’s important scientific and cultural as well as philosophical debates. The author reveals entirely fresh ways of considering the values and beliefs of three very different materialists—Marx, Nietzsche, and Wittgenstein—drawing striking comparisons between their philosophies while reflecting on a wide array of topics, from ideology and history to language, ethics, and the aesthetic. Cogently demonstrating how it is our bodies and corporeal activity that make thought and consciousness possible, Eagleton’s book is a valuable exposition on philosophic thought that strikes to the heart of how we think about ourselves and live in the world.
    title: Materialism
