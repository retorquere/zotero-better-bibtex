    abstractNote: In this groundbreaking and timely book, antiracist educator Robin DiAngelo deftly illuminates the phenomenon of white fragility. Referring to the defensive moves that white people make when challenged racially, white fragility is characterized by emotions such as anger, fear, and guilt, and by behaviors including argumentation and silence. These behaviors, in turn, function to reinstate white racial equilibrium and prevent any meaningful cross-racial dialogue. In this in-depth exploration, DiAngelo explores how white fragility develops, how it protects racial inequality, and what we can do to engage more constructively. –
    title: 'White fragility : why it''s so hard for White people to talk about racism'
