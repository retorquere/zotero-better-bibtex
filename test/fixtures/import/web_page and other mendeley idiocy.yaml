    publicationTitle: Participations
    date: '2019'
    abstractNote: 'Emma Watson started Our Shared Shelf (OSS), a feminist book club, on Goodreads in 2016. Through her work on gender-equality, Watson has accumulated enough cultural capital to be viewed as a legitimate tastemaker in selecting books for a feminist audience, and fits into what Rehberg Sedo describes as the trusted other (Rehberg Sedo, 2004). However, this article argues that Watson creates cultural hierarchies, and extends her feminist brand, through her book choices and the way that she interacts with the OSS community. Despite attempts to diversify the bi-monthly book choices, there has been a preference towards English-language books written by cisgendered, middle-class, able-bodied, heterosexual, white women. Therefore, the list did not represent the international and intersectional nature of OSS: something several readers voice concern about. Additionally, this article examines how the readers’ relationship to their celebrity tastemaker reinforces hierarchies. Engaging in social media can be a performative act: users can construct an identity whilst engaging with social issues. However, there is a danger that a dominant narrative can influence identities and interpretations. Consequently, OSS replicates and upholds patterns of dominance and exclusion and is not an egalitarian space, despite framing itself as one.'
    title: 'Is "Everyone welcome"?: Intersectionality, inclusion, and the extension of cultural hierarchies on Emma Watson''s Feminist book club, "Our shared shelf"'
