    publicationTitle: Participations
    date: '2019'
    abstractNote: This essay describes a fan-based pedagogy and the learning outcomes it produced among college students. We focus on a fandom assignment given in an ‘Introduction to American Popular Culture’ course in an American Studies department at a large state university. The assignment required students to conduct a study of a fan community of their choice. Students developed and administered questionnaires, conducted interviews, and wrote essays describing and interpreting their findings. They were required to include a reflective paragraph discussing what they learned about fandom as a result of their research. Using content analysis, we coded 135 essays from four sections of the class to identify how students spoke about what they learned. Students reported acquiring a deeper understanding of the role of fandom in constructing identity and community. In addition, many questioned and changed their preconceptions about fans and fan behavior. A number also noted that they acquired an appreciation for the theories and methods of academic fan studies. A majority of students indicated that studying fandom resulted in greater self- awareness and awareness of others. We make the case that learning and applying the methods of fan studies prepares students to engage the world outside the classroom with a more critical and reflective lens.
    title: 'Engaging fan cultures: What students learn when they study fans'
