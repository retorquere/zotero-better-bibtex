    abstractNote: This conceptual essay explores the idea of negotiating race-related tensions through the lens of critical Whiteness and antiracism theory. Introducing the concept of thoughtful inaction in relation to White privilege and antiracist work, the essay examines what it means not to act and the consequences of such inaction. Current ways of thinking related to diversity, equity, and inclusion and how mindsets are manifest into (in)action will be investigated, along with barriers confronted when attempting to maintain and facilitate antiracist dispositions and actions in sociopolitical contexts. The author emphasizes conceptualizations of antiracism and argues the benefit in framing antiracist development to better contextualize personal understanding and encourage growth in relation to one’s own racial identity development.
