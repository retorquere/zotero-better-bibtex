    abstractNote: 'The global teen market has significant spending power and an important impact on the world economy. However, much remains unknown about the social motivations of teenage consumers and cross-national cultural differences in teenage shopping. This research studies teenage shopping motivations in two nations: the U.S., which is a highly individualistic national culture with low power distance and low uncertainty avoidance, and France, which is perhaps a somewhat more collectivist, more inter-dependent national culture with high power distance and high uncertainty avoidance. This research samples 570 teenage consumers. Susceptibility to peer influence (SPI) drives teenage consumer shopping in France, while both need for uniqueness (NFU) and SPI motivate teenage shopping in the U.S.'
    title: 'How national culture impacts teenage shopping behavior: Comparing French and American consumers'
