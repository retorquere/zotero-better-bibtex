    abstractNote: '"When we think about what it is to be ''connected,'' we think about memory. We think about history. We think about storytelling. All of these words that we hear-''literacy,'' ''inclusion,'' ''diversity''-those are all words for connection ... When I say to people ''why do we need to have diverse books?'' it''s not because necessarily everybody needs to see themselves reflected in every book, but because we need that sense of connection. We need to live in a global sense." In 2014 Chris Myers and his late great father, the groundbreaking renowned author Walter Dean Myers, published a widely read pair of companion pieces in The New York Times: "The Apartheid of Children''s Literature" and "Where Are the People of Color in Children''s Books?" I was grateful that Chris Myers joined other leading children''s book authors at a roundtable before 2,000 college-age students, public school teachers, and juvenile detention personnel preparing to teach in summer Children''s Defense Fund Freedom Schools programs. Our reading curriculum has long been centered on excellent books reflecting a wide variety of cultures, races, and experiences. For some children it is the first time they have seen books with characters who look like them and share some of the struggles in their lives. Our goal is to help children fall in love with reading, and they respond. "I enjoyed learning about my history." "That [book] really inspired me because he came from a rough neighborhood." "Freedom Schools taught me when I learn, I can have fun with it. It made me a better reader because I can understand things." "I see myself and the books give me hope."'
    title: It's hard to be what you can't see
