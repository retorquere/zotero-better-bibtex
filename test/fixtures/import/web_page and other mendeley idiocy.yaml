    abstractNote: 'Think about the following list of new literacies practices, and evaluate your literacy performance as compared with your students'': emailing; blogging; instant messaging; chatting online; maintaining a website; conducting and collating online searches; processing and evaluating online information; participating in online social networking spaces; manipulating and sharing images; podcasting and videocasting; creating and sharing music videos; shopping online; digital storytelling; reading, writing, and commenting on fan fiction and graphic novels; and creating and sharing digital mashups (Gainer & Lapp, 2010). If you''re like us, you may agree that it''s exciting but difficult to keep pace with all of the new literacies. Since the advent of the Inter- net, change is what has defined instructional classroom literacy practices-not just because of what is being taught, but also because of the literacies students are choosing to learn outside of the classroom.'
