    abstractNote: Purpose - This paper aims to present an exploratory investigation that was used to understand consumer motives for reading internet book reviews as well as the effects of these reviews on purchasing behavior.Design methodology approach - First, focus group interviews of 45 subjects who regularly read internet book reviews and have purchased online books were conducted. Then, content analysis was used to document the rich and diverse experiences and viewpoints of the interview participants.Findings - This exploratory study uncovered five main motives behind the reading of internet book reviews by consumers and illustrated the effects of these reviews and opinions on consumers' purchasing and communication behavior.Practical implications - The results of this study can help online booksellers to understand the role played by consumers' motives for reading internet book reviews in the book-purchasing process, and the resulting influences on purchases. At the same time, the results can serve as a reference in establishing book review management and marketing strategies.Originality value - Searching online word-of-mouth reviews has become an important link in consumers' purchasing decision making. The present study investigates consumer thoughts on motives for reading internet book reviews and their effects, and puts forward several management suggestions.
    title: Motives for and consequences of reading internet book reviews
