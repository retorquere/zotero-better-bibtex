    DOI: 10.1002/jaal.755
    abstractNote: Given the realities of this increasingly connected, complex, and conflicting age, governments and policymakers around the world are recognizing the importance of global education. The field of literacy has not been immune to the pressure to globalize. Today, the notion of literacy must account not merely for social processes but also for global processes. The global turn in literacy studies affirms the cultural and linguistic diversity of students and acknowledges the need to empower them with a plurality of literacies—critical, digital, information, and multilingual literacies, among others—to prepare them for future workplaces. Among the range of new literacies, the most fundamental is cosmopolitan literacy because it entails critical, aesthetic, and empathetic skills and dispositions needed to engage with diverse values in our globalized world. In this commentary, the author discusses the principles informing cosmopolitan literacy and how it can be developed through literature.
    title: 'The need for cosmopolitan literacy in a global age: Implications for teaching literature'
