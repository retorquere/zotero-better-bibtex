    publisher: 'Malden, USA: Blackwell Publishing'
    pages: 247-265
    publicationTitle: Anthropology & education quarterly
    ISSN: 0161-7761
    date: '2008'
    extra: 'tex.city: Malden, USA'
    DOI: 10.1111/j.1548-1492.2008.00020.x
    abstractNote: 'In this article, I reflect on Signithia Fordham and John Ogbu''s classic research on the “burden of `acting White'' ” to develop a long overdue dialogue between Africana studies and critical white studies. It highlights the dialectical nature of Fordham and Ogbu''s philosophy of race and critical race theory by locating the origins of the “burden of `acting White'' ” in the work of W.E.B. Du Bois, who provides some of the intellectual foundations for this work. Following the work of F. W. Twine and C. Gallagher (2008), I then survey the field of critical whiteness studies and outline an emerging third wave in this interdisciplinary field. This new wave of research utilizes the following five elements that form its basic core: (1) the centrality of race and racism and their intersectionality with other forms of oppression'
    title: 'Black metropolis and mental life: Beyond the burden of acting white toward a third wave of critical racial studies'
    citationKey: Akom2008
