    abstractNote: Critics write reviews signalling which of the hundreds of books published each week are worth consumers' time and money. They actively participate in constructing the worth of the objects they review. Yet reviews have consequences not only for books and readers, but also the critics who write them. This chapter explores how critics' reviews are shaped by the perceived consequences of their evaluations. Based on interviews with critics from The New York Times , The LA Times , The Washington Post and others, this chapter reveals the complex emotions and professional ethics that reviewers grapple with when writing negative reviews, including sympathy for the authors, implications for their reputation, fear of retribution, and the temptation of self-promotion.
    title: 'Playing nice, being mean, and the space in between: Book critics and the difficulties of writing bad reviews'
