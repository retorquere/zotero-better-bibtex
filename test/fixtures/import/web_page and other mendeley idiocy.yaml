    DOI: 10.1007/s11256-008-0090-1
    abstractNote: In this paper, I offer my own counterstory of matriculating through a teacher education program as an African American student on a predominately White campus as a reference point for thinking through how racism operates through teacher education’s dominant discourse and practice of teacher reflection. It is an important story to tell primarily because it touches on a largely unexplored dimension of teacher reflection. While the large majority of the literature has focused on how to prepare White preservice teachers to teach in a culturally and racially complex world, little qualitative attention has been given to the preparation of nonwhite students. While there are a few select and important articles that touch on some of the challenges African American students face in predominately White teacher education programs, including covert and overt racism, none focus on how teacher reflection might reproduce these dynamics. Thus what the literature on teacher reflection often suggests is that it is a racially neutral practice. In this essay, however, I suggests otherwise, by providing an intimate and critical look at my process of learning to be a reflective practitioner. The question I seek to grapple with is quite simply, “What does teacher reflection work to repress?”
    title: 'The oppressor within: a counterstory of race, repression, and teacher reflection'
