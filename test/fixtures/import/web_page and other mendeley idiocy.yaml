    abstractNote: In the span of less than a generation, university humanities departments have experienced an almost unbelievable reversal of attitudes, now attacking and undermining what had previously been considered best and most worthy in the Western tradition. John M. Ellis here scrutinizes the new regime in humanistic studies. He offers a careful, intelligent analysis that exposes the weaknesses of notions that are fashionable in humanities today. In a clear voice, with forceful logic, he speaks out against the orthodoxy that has installed race, gender, and class perspectives at the center of college humanities curricula.Ellis begins by showing that political correctness is a recurring impulse of Western society and one that has a discouraging history. He reveals the contradictions and misconceptions that surround the new orthodoxy and demonstrates how it is most deficient just where it imagines itself to be superior. Ellis contends that humanistic education today, far from being historically aware, relies on anachronistic thinking
    title: 'Literature lost: Social agendas and the corruption of the humanities'
