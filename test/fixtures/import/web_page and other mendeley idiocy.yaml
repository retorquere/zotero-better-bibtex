    abstractNote: 'Racism Abstract: Early childhood classrooms in the US continue to become increasingly diverse as we journey through the twenty first century. Yet and still, many early childhood educators have been slow to respond to these shifts in diversity on the basis of both developmental and political concerns. In this guess editorial, I argue for the integration of anti-racist education in the early childhood social studies classroom. The reasons I discuss here concern: when and how children develop racial attitudes, the difficulty of altering long-standing stereotypes, student empowerment, critical teacher reflection, and issues of standardization. I conclude with several considerations teachers should heed as they engage in this form of education. Author Affiliation: (1) Illinois State University, Normal, IL, USA Article History: Registration Date: 05/04/2011 Online Date: 10/08/2011'
