    DOI: 10.1080/01419870601143927
    abstractNote: This article asks the question, 'what does diversity do?' by drawing on interviews with diversity practitioners based in higher education in Australia. Feminist and postcolonial scholars have offered powerful critiques of the language of diversity. This essay aims to contribute to the debate by examining how diversity workers work with the term 'diversity' within the context of education. It shows that diversity as a term is used strategically by practitioners as a solution to what has been called 'equity fatigue'
    title: The language of diversity
