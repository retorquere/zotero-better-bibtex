    abstractNote: From Abraham Lincoln's wry observation that Harriet Beecher Stowe was "the little lady who made this big war" to Mark Twain's "wild proposition" that Walter Scott had somehow touched off sectional hostilities, there have been many competing theories about the impact of literature on nineteenth-century American society. In this provocative book, Kenneth W. Warren argues that the rise of literary realism late in the century was shaped by and in turn helped to shape the politics of racial difference following Reconstruction. Taking up a variety of novelists from this period, including most prominently Henry James and William Dean Howells, Warren demonstrates that even works not directly concerned with race were instrumental in forging a Jim Crow nation. As a literary history, Black and White Strangers places the writing of realistic novels within the context of their serialization in the monthly magazines of the 1880s. By viewing these novels in light of editorial policies regarding social propriety, national unity, and literary aesthetics, Warren reveals the often surprising ways in which realistic fiction at once challenged and abetted the growing conservatism of racial politics. Warren also seeks to bridge the gap between American and African-American literary studies, which have hitherto been "strangers" to each other. James and Howells, he argues, can be understood fully only when read alongside W.E.B. Du Bois and Frances E.W. Harper
    title: 'Black and white strangers : race and American literary realism'
