    abstractNote: Jacqueline Woodson is the celebrated author of more than thirty titles- from picturebooks to middle- grade and young adult novels. She has received numerous accolades including multiple Coretta Scott King Author Awards, a National Book Award, a Robert F. Sibert Informational Book Honor, and multiple John Newbery Honors. Woodson has also received several awards for the body of her work, including the Astrid Lindgren Memorial Award, the Margaret A. Edwards Award, the 2018 Children's Literature Legacy Award, and the 2020 Hans Christian Andersen Award. Woodson is not afraid to embrace issues that some writers might consider too risky in ways that are always nuanced, sensitive, and hopeful- including racism, classism, incest, incarceration, death, and abandonment.
