    DOI: 10.1177/1086296X18754394
    abstractNote: To commemorate the 50th anniversary of the Journal of Literacy Research, this article reviews the trajectory of a particular line of scholarship published in this journal over the past five decades. We focus on African diaspora youth literature to contemplate and extend the ways in which literacy researchers carry out textual analysis research of diverse children’s and young adult literature. We situate this line of scholarship (and its trajectory) within the broader literacy field and then narrow to a focus on diverse books. Next, to turn our gaze as literacy researchers forward to the future, we present our own critical content analysis of a young adult text collection. Our analysis incorporates postcolonial theory and a youth lens to interrogate how underlying ideologies identified within the novels support, refute, or reconstruct dominant beliefs about Black girls. We end with a set of implications for researchers interested in theorizing about or further investigating diverse children’s or young adult literature.
    title: Contemplating and extending the scholarship on children’s and young adult literature
