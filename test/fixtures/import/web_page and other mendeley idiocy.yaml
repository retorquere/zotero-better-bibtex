    abstractNote: In this wide ranging collection of essays, eleven literary scholars and creative writers examine authorship and authority in relation to the production and reception of cultural texts. Ranging in time from the Renaissance to the era of digital publishing, the essays invite us to reconsider the influential theories of Roland Barthes, Michel Foucault, and Pierre Bourdieu for our understanding of writers such as Philip Sidney, Thomas Hardy, Laura Riding, W.B. Yeats, Gertrude Stein, and J.M. Coetzee. Shedding new light on authority’s complex role in the generation of cultural meaning, the essays will be of interest to students and teachers of literary history and critical theory alike.
    title: 'Authority matters : Rethinking the theory and practice of authorship'
