    abstractNote: 'This article analyzes the 2002 Coretta Scott King Award book by Mildred Taylor entitled The Land. The novel and its author are situated within a tradition of historical fiction written by and about African Americans. I then offer an analysis that utilizes Critical Race Theory as an interpretive tool for examining the ways Taylor embeds meanings of land ownership into the novel. In particular the following themes emerged: (1) inspiration and adoration, (2) entitlement and privilege, and (3) freedom and security. The conclusion addresses the importance of applying Critical Race Theory to literary studies as well as identifying ways to purposefully incorporate African American young adult historical fiction within today''s classrooms. © 2008 Springer Science+Business Media, LLC.'
    title: 'An author as a counter-storyteller: Applying critical race theory to a coretta scott king award book'
