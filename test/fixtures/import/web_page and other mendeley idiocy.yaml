    abstractNote: 'The treatment in what follows of the politics of hegemony is not per se one of Gramsci, or Laclau or of Stuart Hall''s earlier work. At stake is something that encompasses a more general regime of power that will be developed throughout the length of this: what might be called ''extensive politics''. What I will try to show is that such extensive power or such an extensive politics is being progressively displaced by a politics of intensity. I will trace the shift from hegemony or extensive politics to such an intensive politics in terms of: 1) a transition to an ontological regime of power, from a regime that in important respects is ''epistemological'', 2) a shift in power from the hegemonic mode of ''power over'' to an intensive notion of power from within (including domination from within) and power as generative force, 3) a shift from power and politics in terms of normativity to a regime of power much more based in what can be understood as a ''facticity''....'
    title: 'Power after hegemony: Cultural studies in mutation?'
