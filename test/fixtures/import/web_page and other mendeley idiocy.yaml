    abstractNote: The purpose of this research was to investigate the relationship of fiction exposure and individual differences in morally relevant traits such as empathy, moral identity, and moral agency. Results from Study 1 were used to form hypotheses and specify statistical models for a preregistered second study. Relationships between moral constructs and three measures of fiction exposure (adult and young adult [YA] fiction and nonfiction) were tested with structural equation models (controlling for personality and gender). Associations between YA fiction and empathic concern, integrity, and moral agency were consistent across studies, as was that between adult fiction and moral permissibility. In line with theories of empathic simulation, empathy fully mediated the association between YA fiction and the sense of moral self. (PsycINFO Database Record (c) 2020 APA, all rights reserved)
