    abstractNote: This article describes a discussion tool that can be used to increase white people’s ability to recognize and interrupt behaviors associated with white privilege and internalized superiority. The discussion tool is in the form of a scenario, developed by a multiracial team of facilitators. The scenario describes a meeting taking place in a not-for-profit organization. Two white people in the meeting display common patterns of interaction that reinforce white privilege and its consequences. I offer an analysis of the behaviors and guidance on how facilitators can use the scenario to increase white participant’s ability to recognize and interrupt white superiority in themselves and other whites.
