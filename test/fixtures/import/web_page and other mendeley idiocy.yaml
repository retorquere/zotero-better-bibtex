    abstractNote: This article offers an analysis of the impact of professional social-media engagement upon authors. Authors primarily use Facebook, Twitter and there is growing use of Pinterest. Authors use social-media platforms primarily for marketing, publicity and making contact with readers. They tend to adopt a multi-layered approach to self-presentation and the lines between their ‘public’ and ‘private’ identities are blurred. The research reveals a limited author-reader community, but a much stronger online author–author community, founded upon practical support and encouragement. There are implications for the publishing industry as authors believe their publishers lack social-media expertise. The commercial benefits of maintaining a social-media presence are unclear for many authors.
    title: 'Authors using social media: Layers of identity and the online author community'
