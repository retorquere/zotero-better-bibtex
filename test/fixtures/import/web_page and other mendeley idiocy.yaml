    date: '2018'
    DOI: 10.20396/rdbci.v16i2.8650424
    abstractNote: O presente artigo tem como objetivo mapear e discutir os conceitos em torno da folksonomia e do etiquetamento em Sites de Redes Sociais Segmentadas em livros, levando em consideração as diferentes formas de classificação e categorização feitas pelos usuários do site Goodreads. Nossa investigação parte dos debates teóricos sobre as diferentes nomenclaturas utilizadas para folksonomia e de Sites de Redes Sociais Segmentadas (SRSS) e seus diferentes usos. Com o intuito de observar as aplicações desses conceitos, realizamos uma observação exploratória da interface do site norte-americano Goodreads descrevendo suas potencialidades de etiquetamento social. Os resultados iniciais indicam que a folksonomia no Goodreads pode ser compreendida como processo para organização pessoal das leituras e a catalogação social funciona para a visibilidade e buscabilidade das resenhas.
    title: 'Folksonomia em sites de redes sociais segmentadas (SRSS) em livros: um estudo exploratório da interface do Goodreads'
