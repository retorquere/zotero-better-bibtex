    abstractNote: 'Abstract This article traces a lineage of narrative experiments from Toni Morrison’s Playing in the Dark: Whiteness and the Literary Imagination (1992) and “Recitatif” (1983) through recent texts by Colson Whitehead and Percival Everett. In her critical work, Morrison identifies a “sinister” tradition in which “the readers of virtually all of American fiction have been positioned as white.” From that perspective, she argues, the characters in fiction can safely be presumed white, unless the narrative explicitly indicates otherwise'
