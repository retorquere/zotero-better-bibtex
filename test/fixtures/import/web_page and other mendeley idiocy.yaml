    abstractNote: It’s undeniable that the literary voices of marginalized communities have been underrepresented in the publishing world, but the lessons of history warn us about the dangers of censorship. Unless they are written about by members of a marginalized group, the harsh realities experienced by members of that group are dismissed as stereotypical, discouraging writers from every group from describing the world as it is, rather than the world we would like.
