    publicationTitle: No Shelf Required
    date: '2019'
    abstractNote: What is a book review? Many have attempted to answer this question over the last few decades in a multitude of ways—from informed scholars, librarians, and booksellers to publishers, authors and readers. While their views differ widely on how successful book reviews are in bringing us closer to a book’s quality—and whether this is even possible—their definitions of book reviews and their core purpose seem to be in sync. To start, book reviews are a ‘genre’ in their own right, as they have features specific to them, and they can be as entertaining to read as the books they put under the microscope. These features, of course, depend on the context in which the books are reviewed (e.g., reviews found in academic journals are more in-depth and lengthier than those found in mainstream newspapers and magazines), but the general purpose of book reviews is always to serve as kind of an economic model, helping readers—whoever they may be—to decide if they should spend their money on a book, be it for entertainment, enlightenment, or scholarly pursuit. In other words, the main purpose of book reviews is to reduce search costs and uncertainty (Clement &amp; others 78). In this sense, then, readers hope that book reviews will guide them in the direction of the books they both want and need.
    title: Like beauty, quality is in the eye of the beholder
