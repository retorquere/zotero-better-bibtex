    abstractNote: This reflexive ethnography looks closely at what motivates and empowers a group of six white teachers to challenge the status quo and address racism and white privilege in their classrooms and the school. Most previous research on anti-racist pedagogy has focused on preservice teachers and educators involved in university courses or anti-racism training workshops. Few studies have looked at how veteran teachers can voluntarily work together to challenge racism within themselves and their students. In this study five white women teachers in a predominantly white suburban elementary school in central New York voluntarily came together with the author, who is also a teacher in the same school, to form an anti-racism study group. Using a participatory action research framework, the group - four classroom teachers, the librarian, and the author, read about, discussed and reflected upon the meaning of race, racism, and white privilege through study group meetings and a series of active dialogues with the author. Participants' personal biographies revealed previous experiences with racial issues, which had influenced the adoption of social justice perspectives. Despite this, the group struggled to come to terms with an uncritical acceptance of white privilege, racial stereotyping, and the myth of equal opportunity. The group evaluated children's literature that might be used to develop an anti- racism curriculum that met the needs of both the white students and the small number of students of color in their classrooms. Based on this work, the classroom teachers developed and carried out their own classroom research projects using one or more pieces of children's literature. This study shows that veteran teachers working voluntarily can come together to critically examine the issues of racism and privilege, and to work at deconstructing reality and the institutions of which they are part. It also demonstrates the power of participant action research in which teachers carry out and share their classroom studies with their co-participants as an effective way to make substantive changes in the way they teach their students, and in the anti-racism activism they pursue in their personal lives.
    title: 'Bookmarking racism: Challenging white privilege through children''s literature and participatory action research in a suburban school'
