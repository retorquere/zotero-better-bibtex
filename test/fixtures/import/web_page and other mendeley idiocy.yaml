    abstractNote: Book reviews written by readers and published on digital sites such as Goodreads are a new force in contemporary book culture. This article uses feminist standpoint theory to investigate the language used in Goodreads reviews to better understand how these reviewers articulate intimate reading experiences. A total of 692 reviews of seven bestselling fiction and nonfiction books are analyzed by two methods. The first, thematic content analysis, involves close reading of the reviews. The second, sentiment analysis, is an automated “distant reading” process. These methods prompt us, as researchers, to reflect on the way they foster or inhibit a sense of proximity to readers, even as they reveal predominant features of Goodreads reviews. Together, the methods reveal that 86.1
