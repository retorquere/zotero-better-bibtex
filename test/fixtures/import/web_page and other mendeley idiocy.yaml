    abstractNote: The call for increased diversity in books for adolescent readers should play a role in decisions about purchasing books for library and classroom shelves, and book reviews are an instrumental tool in making these decisions. The research project described here sought to conduct a close examination of book reviews in order to assess whether or not elements of diversity are described in reviews, how they are described, and the degree to which reviews accurately and comprehensively reflect and communicate issues of diversity in the books being reviewed. Through an examination of reviews written about books popular with teens, this research reveals important trends in the portrayals of diversity in these books. It also reveals the complexities of identifying diversity, of describing representations of diversity in short texts like book reviews, and the disconnect that exists at times between reviews and the content of books (in terms of diversity). The article closes with recommendations for librarians and those who review books in response to the call for more diversity in books written for teen readers. The need for diversity in the representations of characters and experiences in books for adolescents has long been recognized by librarians, teachers, and writers of adolescent literature. The most recent push for diversity, collected under the banner of the “We Need Diverse Books” movement (http://weneeddiversebooks.org/), has brought these concerns to the twenty-first
    title: 'Hunky cajuns and gay sextons: Diversity as represented in adolescent book reviews'
