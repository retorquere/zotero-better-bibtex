    abstractNote: The concept of Young Adult fiction is a fluid one, which changes as often as new authors emerge and disappear. This research collates the historical ideas of YA fiction and goes some way to explaining how today's notions of the genre came into being. The reading habits of children versus the adult idea of teenage reading are also explored, centring on the issue of censorship and the arguments for and against. Contemporary YA authors give examples of why they think it is wrong to censor the reading habits of teenagers, whilst it is acknowledged that the arguments will run and run.
