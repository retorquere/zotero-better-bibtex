    publisher: Leiden
    date: '2016'
    abstractNote: 'Nominated — Society of Professors of Education Outstanding Book Award 2017. Discussing race and racism often conjures up emotions of guilt, shame, anger, defensiveness, denial, sadness, dissonance, and discomfort. Instead of suppressing those feelings, coined emotionalities of whiteness , they are, nonetheless, important to identify, understand, and deconstruct if one ever hopes to fully commit to racial equity. Feeling White: Whiteness, Emotionality, and Education delves deeper into these white emotionalities and other latent ones by providing theoretical and psychoanalytic analyses to determine where these emotions so stem, how they operate, and how they perpetuate racial inequities in education and society. The author beautifully weaves in creative writing with theoretical work to artistically illustrate how these emotions operate while also engaging the reader in an emotional experience in and of itself, claiming one must feel to understand. This book does not rehash former race concepts'
    title: 'Feeling white : a whiteness, emotionality, and education'
