    abstractNote: Roland Barthes,the outstanding thinker as well as the semiologist of France,has left great contribution to us human beings.His The Death of the Author made a strong,polemical argument against the centrality of the figure of the author in literary study.It states that the intentions of the author are meaningless to the interpretation of a text.Michel Foucault,the famous French philosopher and the historian in the ideology field,in his What is An Author,shows the idea of the author,as a timeless,irreducible category,is,rather,a “function” of discourse which has changed in the course of history.The author means quite different in their ideas.But what the author really is?
