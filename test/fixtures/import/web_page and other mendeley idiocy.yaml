    abstractNote: The Routledge Companion to Media and Activism is a wide-ranging collection of 42 original and authoritative essays by leading contributors from a variety of academic disciplines. Introducing and exploring central debates about the diverse relationships between both media and protest, and communication and social change, the book offers readers a reliable and informed guide to understanding how media and activism influence one another. The expert contributors examine the tactics and strategies of protest movements, and how activists organize themselves and each other; they investigate the dilemmas of media coverage and the creation of alternative media spaces and platforms; and they emphasize the importance of creativity and art in social change. Bringing together case studies and contributors from six continents, the collection is organized around themes that address past, present and future developments from around the world. The Routledge Companion to Media and Activism is an essential reference and guide for those who want to understand this vital area.
