    abstractNote: 'For many educators who lead cross-racial discussions, creating ''safe'' spaces in which students can express their views is a familiar goal. Yet what constitutes safety is rarely defined or contextualized. In the absence of this contextualization, the goal of safety is most often driven by White participants who complain that they are (or fear being) ''attacked'' in these discussions. This article examines this specific complaint, which we term as the discourse of violence. We draw on data from a facilitated race discussion and identify five key effects of this discourse in cross-racial discussion about race: positions and re-inscribes Whites as racially innocent'
    title: 'Getting slammed: White depictions of race discussions as arenas of violence'
