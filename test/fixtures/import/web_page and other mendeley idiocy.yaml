    abstractNote: This research expands on a previous discourse analysis of censorship on challenges to diverse books through more robust analysis of the challenge cases. The article specifically focuses on two common themes found in the arguments that book challengers give for the redaction, restriction, relocation, and removal of diverse titles in and from school curricula, school libraries, and public library collections in the U.S. The article begins with a working definition of diverse books and a brief overview of the campaign to increase their publication and circulation in the U.S. An overview of previous research on general book challenges and challenges to diverse literature is provided, as well as the methodology for analysis. The article concludes with a discussion of recommendations for protecting access to diverse books in public libraries and schools.
