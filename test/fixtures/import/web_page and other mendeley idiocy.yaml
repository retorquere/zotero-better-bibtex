    url: https://www.washingtonpost.com/news/answer-sheet/wp/2014/09/16/how-common-cores-recommended-books-fail-children-of-color/?arc404=true
    publicationTitle: The Washington Post
    date: 2014-09
    abstractNote: 'Critics of the Common Core have questioned a number of different aspects of the standards, including how they were written, whether they are developmentally appropriate and whether too much emphasis has been placed on non-fiction at the cost of literature. Here is a look at an issue that has gotten little attention: How the recommended books in the appendix of the standards try to meet the needs of students of color. It was written by Jane M. Gangi, an associate professor in the Division of Education at Mount Saint Mary College in Newburgh, New York, and Nancy Benfer, who teaches literacy and literature at Mount Saint Mary College and is a fourth-grade teacher at Bishop Dunn Memorial School. Gangi is the author of three books: “Encountering Children’s Literature: An Arts Approach,” “Deepening Literacy Learning: Art and Literature Engagements in K-8 Classrooms (with Mary Ann Reilly and Rob Cohen),” and “Genocide in Contemporary Children’s and Young Adult Literature: Cambodia to Darfur. ” Both are members of the Collaborative for Equity in Literacy Learning at Mount Saint Mary College. Gangi may be reached at jane.gangi@msmc.edu;Benfer at nb6221@my.msmc.edu.'
    title: How Common Core’s recommended books fail children of color
