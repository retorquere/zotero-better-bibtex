    DOI: 10.1080/08900520701315269
    abstractNote: As the latest tool for disseminated information and editorial comment shaping public opinion, blogging is quickly gaining popularity, prominence, and power. One major controversy for the new medium of circulating news and commentary is to what extent or even whether blogs should have codes of ethics. We examined 30 politically-oriented weblogs. Of these, only a few had a code of ethics, stated or implied. Little cohesion existed between the codes of ethics, but a few themes emerged. Qualitative analysis of the codes of ethics shows that what bloggers valued most included accuracy, credibility, and etiquette. We further provide evidence to support the prevailing thought that, while appearing to be "ethical" seems important to bloggers, blogging ethics and credibility are difficult to operationalize.
    title: '"If I break a rule, what do I do, fire myself?" ethics codes of independent blogs'
