    DOI: 10.1016/S0147-1767(02)00064-0
    abstractNote: Intercultural training poses a special challenge due to the fact that it is most often attempted in isolation from the new culture. This experience gap, which those involved with intercultural training will readily recognize, is the focus of this article. Can quality, imaginative fiction be a source to bridge this pedagogical chasm between the "we" and the "they?" Nothing can take the place of actual experience, but until that most important facility is available, engaging fiction can provide a type of virtual learning. If the human brain can be likened to the hardware, then imaginative, interculturally oriented fiction, is the software. Intercultural competencies can be better achieved by evoking the imagination of the culture learner through the vicarious experience afforded through good fiction. This article will offer a sampling from the vast body of culturally significant literature to see how such works could support the training process. These practical examples from a variety of genres will be couched in the framework of a transformative training theory that is workable. © 2002 Elsevier Science Ltd. All rights reserved.
    title: 'Reducing intercultural friction through fiction: Virtual cultural learning'
