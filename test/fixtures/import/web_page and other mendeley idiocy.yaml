    date: '2019'
    extra: 'tex.city: Los Angeles'
    abstractNote: 'If you''re looking for a case study in toxic internet culture, look no further than the online world of young adult fiction. Here''s the short version: In recent years, young adult, or Y.A., fiction has come into its own as a genre, reliably producing a small number of megahits that have turned their authors into millionaires. During that same period, it has begun to grapple with some difficult questions about diversity and representation. Y.A. fiction, like many other areas of publishing, has a bit of a diversity problem, despite being a liberal-minded industry located in New York City. But while the motivation behind the movement for more diverse voices is commendable, the manifestation of this impulse on social media has been nothing short of cannibalistic. Y.A. Twitter does not appear to be a representative sample of Y.A. readers. Those readers are split about 50-50 between minors and adults, according to what data they have, but on Twitter the community is almost entirely adults.'
    title: Teen fiction twitter is eating its young
