    abstractNote: This thesis examines the place of the child within the domains of children's literature criticism from the angle of childist criticism, mainly as regards the production of literature. The introduction briefly addresses the world of children's literature criticism and puts forward some of the fundamental issues which will be dealt with as the thesis develops. Chapter One looks at some of the arguments put forward by Jacqueline Rose and Karin Lesnik-Oberstein and their reading of the fundamental issues regarding the place of the child in the writing and criticism of children's literature. The chapter draws parallels between their work and that of Jean-Jacques Lecercle as he writes about the notion of alterity. Chapter Two introduces the notion of childist criticism, its origins, uses, and shortcomings. Through childist criticism, the chapter offers an alternative position to that of Rose and Lesnik-Oberstein. Chapter Three considers some of implications deriving from the arguments developed...
