    publicationTitle: Understanding and Dismantling Privilege
    date: '2012'
    abstractNote: We think of critical humility as a way of being that includes a reflective practice that can help white people develop capacity to interrupt white privilege effectively. We describe the experiential sessions that we facilitated as all-day institutes at the White Privilege Conference (WPC) beginning in 2008 and continuing to the upcoming conference in 2012. The purpose of our experiential institute is to give white people an opportunity to learn about critical humility. The purpose of this paper is to provide enough information about each experiential activity in the institute so that others can use our work for their own purposes.
    title: 'White on white: Communicating about race and white privilege with critical humility'
