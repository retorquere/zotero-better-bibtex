    abstractNote: 'Chadderton borrowed from the seemingly contradictory scripts of critical theory and post-structural theory to claim whiteness is both an arbitrary construct and a social reality, and that scholars should make whiteness visible as such. [...]Miller (2015) wrote that when conducting critical ethnographic work about whiteness, ...it is important to state that although whites have been centred for decades in almost every aspect of our society, focus is rarely given to the racialised nature of being white. [...]students broke into the voluntary research groups in which they had been working during the fall to discuss how this workshop connected with the research they were conducting. According to this group of students, the equity statement contributed to reaffirming that superiority (i.e. "white people equal good") even as, in Mark''s sarcastic words, white people are expected to "still be nice" to people who are not included in the normalized category of whiteness. [...]Wave White Teacher Identity Studies: A Review of White Teacher Identity Literatures From 2004 Through 2014.'
