    abstractNote: The literary field has been conceptualized in social scientific work as patterned in particular ways. Historically, popular reading has been linked with contested processes of social change. Tastes for reading have, following Bourdieu, been seen as embedded in continuing processes of distinction and the making of hierarchies. Research has demonstrated the ways in which these hierarchies might be reflective of gender as well as of class relationships. This article examines the findings of the Cultural Capital and Social Exclusion study in the light of these debates. The survey gathered data about the types of reading material used by a representative sample of the United Kingdom (UK) population, including their preferences for newspapers, magazines and books. The article reports on a number of possible relationships identified in the study about the location of reading as a social practice, drawing on the survey data and explanatory accounts of respondents' reading preferences...
