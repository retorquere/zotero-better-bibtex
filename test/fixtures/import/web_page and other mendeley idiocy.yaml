    abstractNote: Using unobtrusive observations in comics stores and comics conventions as well as in-depth interviews with comics aficionados and store owners from five different countries this work examines the interpersonal communication patterns of comics aficionados, focusing on situations in which they meet and discuss their mutual interest. A repeating sequence of events had been identified and was subsequently dubbed as a ‘recommendation ceremony’. The analysis suggests that the ‘recommendations ceremony’ helps the people to fulfill their material and psychological needs as well as social functions that are crucial to the creation of the comics readers’ sense of community.
