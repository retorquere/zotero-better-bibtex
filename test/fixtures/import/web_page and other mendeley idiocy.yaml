    abstractNote: Drawing on a variety of sources, this essay outlines the beginnings of a political economy of the children's literature publishing industry. The rapidly changing set of institutional and socioeconomic and political circumstances known as fast capitalism provides the backdrop for a detailed discussion of the profound impact that the consolidation of the publishing industry by giant international media conglomerates is having on the kinds of books that are commissioned, written, produced, and marketed. Central to the analysis is a consideration of the continuing commodification of children's literature that is apparent in the ever expanding mass-market side of the industry, the explosive increase in the licensing and merchandizing of characters from children's books and popular films, and the proliferation of a variety of series books that have assumed the status of brand names comparable to other commercial commodities. I give particular attention to some of the debates surrounding the publication of multicultural children's literature as they are especially revealing of political and economic factors that impinge on children's literature. The importance of this analysis for literacy educators and researchers derives from the conviction that the complex processes that lead to the publication of literature for young people directly influences the kinds of books that are available to members of society and thus is crucial to the future of both education and democratic society.
    title: 'Children''s literature at the turn of the century: "Toward a political economy of the publishing industry"'
