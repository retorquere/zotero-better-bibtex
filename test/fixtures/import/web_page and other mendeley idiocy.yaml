    abstractNote: '"The past decade has been one of the most racially turbulent periods in the modern era, as the complicated breakthrough of the Obama presidency gave way to the racially charged campaigning and eventual governing of Donald Trump. Keepin'' It Real presents a wide-ranging group of essays that take on key aspects of the current landscape surrounding racial issues in Trump-era America, including the place of the Obamas, the rise of the alt-right and White nationalism, Donald Trump, Colin Kaepernick and the backlash against his protests, Black Lives Matter, sexual politics in the Black community, and much more. America''s racial problems aren''t going away any time soon. Keepin'' It Real will serve as a marker of the arguments raging right now, and an argument for the changes that need to be made to become the better nation it has long imagined itself to be." –'
