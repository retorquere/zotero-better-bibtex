    abstractNote: 'Use of the term “diverse books” has increased radically in the professional library discourse in recent years. In this paper, I ask what criteria we think a book must satisfy to be properly characterized as “diverse.” To begin answering that question, I conduct a preliminary conceptual analysis of “diverse books,” using the intuitive responses of MSLIS students in a class on genre fiction as a jumping-off point for philosophical inquiry. My aim is twofold: first, to kickstart the process of clarifying what we mean to talk about when we talk about diverse books and, second, to demonstrate how the LIS classroom can serve as a resource for populating the conceptual imagination.'
    title: 'We need them but what are they?: a conceptual analysis of diverse books'
