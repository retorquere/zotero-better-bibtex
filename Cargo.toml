[package]
name = "bbt"
version = "0.1.0"
edition = "2024"

[dependencies]
any_ascii = "0.3.3"
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15.7"
gherkin = "0.16.0"
git2 = "0.21.0"
octocrab = "0.54.9"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["stream"] }
rust-s3 = "0.38.0"
sanitize-filename = "0.6.0"
serde_json = "1"
serde_yaml = "0.9.34"
tokio = { version = "1.54.1", features = ["full"] }
zip = "9.4.2"
